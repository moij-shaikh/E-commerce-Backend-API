<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <style>
        .orders_section {
            width: 80%;
            margin: 40px auto;
            min-height: 400px;
        }
        .order_card {
            background: #FFF9F0;
            border: 1px solid #E7D9C8;
            border-radius: 8px;
            padding: 20px;
            margin: 18px 0;
        }
        .order_header, .order_footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .order_status {
            background: #F1E5D6;
            color: #6F4E37;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .order_card p {
            margin: 12px 0;
        }

        .order_actions {
            display: flex;
            gap: 10px;
        }

        .order_actions button {
            cursor: pointer;
        }
        .view_order{
            padding: 8px 16px;
            border: 1px solid black;
            background-color: green;
            border-radius: 8px;
            color: white;
        }
        @media(max-width: 600px) {
            .orders_section {
                width: 92%;
            }

            .order_header, .order_footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>My Orders</h1>
        <div class="order_list">

        </div>
    </main>
    <script>
        async function load_order(){
            const token = sessionStorage.getItem("access_token");
            if (!token){
                window.location.href="/login"
                return
            }
            const req = await  fetch("/order",{
                method:"GET",
                headers:{
                    "Authorization":"Bearer "+token
                }
            })
            const res = await  req.json()
            if(req.status == 404){
                alert('No order')
                return
            }
            if(req.status == 401){
                window.location.href="/login"
                return
            }
            const order_list = document.querySelector(".order_list")
            order_list.innerHTML=""
            res.forEach(order=>{
                const card=document.createElement("div")
                card.className = "order_card"
                card.innerHTML=`
                <div class="order_head">
                    <h3>Order #${order.id}</h3>
                    <span class="order_status">${order.status}</span>
                </div>
                <p>Placed: ${new Date(order.order_placed_at).toLocaleString()}</p>
                <div class="order_footer">
                    <p>Products: ${order.total_products}</p>
                    <h3>₹${order.total_amount}</h3>
                </div>
                <div class="order_actions">
                    <button class="view_order">
                            View Details
                    </button>
                </div>
                `;
                card.querySelector(".view_order").addEventListener("click",()=>{
                    window.location.href = `/order/detailed/${order.id}`
                })
                order_list.append(card)
            })
        }
        load_order()
    </script>
</body>
</html>
