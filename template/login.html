<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <script src="/static/login.js" defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            }
        div{
            padding: 30px;
            border: 1px solid #3a5a40;
            border-radius: 12px;
            width: 300px;
        }
        h1 {
            text-align: center;
            color: #3a5a40;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 0 0 4px 0;
            background: #a3b18a;
            border: 1px solid #3a5a40;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
        <form id="login_form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
