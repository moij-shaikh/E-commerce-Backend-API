<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            }
        div{
            padding: 30px;
            border: 1px solid #3a5a40;
            border-radius: 12px;
            width: 300px;
        }
        h1 {
            text-align: center;
            color: #3a5a40;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 0 0 4px 0;
            background: #a3b18a;
            border: 1px solid #3a5a40;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
        <form id="login_form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <button type="submit" onclick="window.location.href='/register'">Register</button>
        </form>
        <h1 id="login_message"></h1>
    </div>

<script>
    const login_form = document.getElementById("login_form");
    login_form.addEventListener("submit", async function(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const form_data = new URLSearchParams();
        form_data.append("username", username);
        form_data.append("password", password);
        try {
            const response = await fetch("/user/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: form_data,
                credentials: "same-origin"
            });
            const data = await response.json();
            if (!response.ok) {
                document.getElementById("login_message").textContent =
                    data.detail;
                return;
            }
            sessionStorage.setItem("access_token", data.access_token);
            document.getElementById("login_message").textContent ="login is successful. "
            window.location.href="/"
        }   
        catch(error) {
            console.log(error);
            document.getElementById("login_message").textContent =
                "Something went wrong";
        }
    });

</script>
</body>
</html>
